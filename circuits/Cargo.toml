[package]
name = "shielded-badges-circuits"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
halo2_proofs = { version = "0.4.0", default-features = false }
halo2_gadgets = "0.6.0"
pasta_curves = "0.6.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = "0.10"
rand_core = "0.10"
